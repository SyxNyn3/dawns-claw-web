# Dawns Talon — Netlify configuration
# Plain static site: no build step, serve the repo root (index.html is the default document).

[build]
  publish = "."
  command = ""

# Security + polish headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
